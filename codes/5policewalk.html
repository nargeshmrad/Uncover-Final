<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5policeWalk Scene</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .background {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .textbox {
      position: absolute;
      bottom: 3%;   /* adjust as needed */
      left: 40%;     /* adjust as needed */
      width: 20%;    /* responsive width */
      height: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      user-select: none;
    }

    .textbox.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="scene-container">
    <img src="../assets/5policewalk/Police-WallChill.png" alt="Background" class="background" />
    <img src="../assets/5policewalk/HimTextBox.png" alt="Textbox" class="textbox" id="himTextbox" />
    <audio id="himAudio" src="../assets/5policewalk/HimVoice.mp3"></audio>
  </div>

  <script>
    const himTextbox = document.getElementById('himTextbox');
    const himAudio = document.getElementById('himAudio');

    function playScene() {
      himTextbox.classList.add('visible');
      himAudio.play();

      himAudio.onended = () => {
        himTextbox.classList.remove('visible');
      };
    }

    // Automatically start when page loads (optional)
    window.onload = () => {
      playScene();
    };
  </script>
</body>
</html>
