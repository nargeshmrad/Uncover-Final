<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>With Colleagues</title>
  <style>
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }

    .picture {
      aspect-ratio: 1065 / 1176;
      width: min(100vw, calc(100vh * (1065 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1065)));
      position: relative;
      overflow: hidden;
    }

    .background {
      width: 100%;
      height: 100%;
      display: block;
    }

    .text-overlay {
      position: absolute;
      width: 55%;
      top: 90%;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="picture" id="colleagueScene">
    <img class="background" src="assets/optimized/withColleagues.png" alt="With Colleagues Background">
    <img class="text-overlay" id="womanText" src="assets/optimized/womanWorkText.png" alt="Woman Dialogue">
    <img class="text-overlay" id="manText" src="assets/optimized/manWorkText.png" alt="Man Dialogue">
    <img id="envelopeImg" src="assets/optimized/envelope.png" alt="Envelope" style="display:none; position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); width:60%; z-index:3; cursor:pointer;">
    <div id="fireTextContainer" style="display:none; position:absolute; top:40%; left:57%; transform:translate(-50%,-50%); width:60%; height:auto; z-index:4; pointer-events:none;">
      <img id="fireTextImg" src="assets/optimized/fireText.png" alt="Fire Text" style="width:80%; height:auto; pointer-events:auto; cursor:pointer;">
    </div>
  </div>

  <script type="module" src="WithColleagues.js"></script>

</body>
</html>
