<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>At Work Scene</title>
  <style>
    /* --- 1. RESET & CENTER STAGE --- */
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }

    /* --- 2. MAIN CONTAINER (.picture) --- */
    .picture {
      aspect-ratio: 1065 / 1176;
      width: min(100vw, calc(100vh * (1065 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1065)));
      position: relative;
      overflow: hidden;
    }

    .background {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* --- 3. HOVER IMAGE (PHONE) --- */
    .phone {
      position: absolute;
      width: 50%; /* Adjust size as needed */
      left: 10%;  /* Adjust position */
      top: 50%;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 2;
    }

    .picture:hover .phone {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="picture">
    <img class="background" src="assets/optimized/atWork.png" alt="At Work Background">
    <img class="phone" src="assets/optimized/phone.png" alt="Phone">
  </div>

  <script type="module" src="AtWork.js"></script>

</body>
</html>
