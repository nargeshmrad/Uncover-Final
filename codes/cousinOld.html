<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cousin Old Scene</title>
<style>
  body, html {
    margin: 0; padding: 0;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .scene-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    z-index: 0;
  }
  .textbox {
  position: absolute;
  width: 80%;             /* Responsive scaling */
  max-width: 400px;       /* Limits size on large screens */
  left: 30%;              /* Horizontally positions text box */
  bottom: 76%;            /* Distance from bottom */
  transform: translateX(-50%);  /* Centers the box on 30% point */
  user-select: none;
  z-index: 2;
  opacity: 1;
  transition: opacity 1.5s ease;
}

  .textbox.hidden {
    display: none;
  }
  #choices {
  position: absolute;
  left: 70%;              /* Position container to the right */
  bottom: 76%;            /* Distance from bottom */
  transform: translateX(-50%); /* Center on 65% horizontal point */
  display: flex;
  gap: 20px;              /* Space between the two choices */
  opacity: 0;
  pointer-events: none;
  z-index: 2;
  transition: opacity 1.5s ease;
}

.choice {
  width: 30%;             /* Scale based on viewport width */
  max-width: 300px;       /* Don't grow past this */
  height: auto;
  cursor: pointer;
  user-select: none;
  display: block;
}

  #choices.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #choices img:hover {
    filter: brightness(1.1) drop-shadow(0 0 10px #fff);
  }
  @media (max-width: 900px) {
    #choices img {
      max-width: 40vw;
    }
  }
  @media (max-width: 600px) {
    #choices img {
      max-width: 60vw;
    }
  }
</style>
</head>
<body>

<div id="container" class="scene-container">
  <img id="bg1" class="bg" src="../assets/cousinOld/CousinOld.png" />

  <img id="text1" class="textbox" src="../assets/cousinOld/CousinText.png" />
  <img id="text2" class="textbox hidden" src="../assets/cousinOld/CousinText2.png" />
  <img id="text3" class="textbox hidden" src="../assets/cousinOld/CousinText3.png" />

  <div id="choices">
    <img id="choice1" class="choice" src="../assets/cousinOld/Choice1.png" />
    <img id="choice2" class="choice" src="../assets/cousinOld/Choice2.png" />
  </div>
</div>

<script>
  // Load audio
  const cousin1 = new Audio("../assets/cousinOld/Cousin1.mp3");
  const cousin2 = new Audio("../assets/cousinOld/Cousin2.mp3");
  const cousin3 = new Audio("../assets/cousinOld/Cousin3.mp3");
  const choice1Sound = new Audio("../assets/cousinOld/Choice1.mp3");
  const choice2Sound = new Audio("../assets/cousinOld/Choice2.mp3");

  // DOM elements
  const text1 = document.getElementById("text1");
  const text2 = document.getElementById("text2");
  const text3 = document.getElementById("text3");

  const choicesDiv = document.getElementById("choices");
  const choice1 = document.getElementById("choice1");
  const choice2 = document.getElementById("choice2");

  // Start scene
  window.onload = () => {
    cousin1.play();
    cousin1.onended = () => {
      fadeOut(text1, 1500).then(() => {
        text1.classList.add("hidden");
        choicesDiv.classList.add("visible");
      });
    };
  };

  // Fade helpers
  function fadeOut(el, duration) {
    return new Promise(res => {
      el.style.transition = `opacity ${duration}ms ease`;
      el.style.opacity = 0;
      setTimeout(res, duration);
    });
  }

  function fadeIn(el, duration) {
    return new Promise(res => {
      el.classList.remove("hidden");
      el.style.transition = `opacity ${duration}ms ease`;
      el.style.opacity = 1;
      setTimeout(res, duration);
    });
  }

  // Hover audio
  choice1.addEventListener("mouseenter", () => {
    choice1Sound.currentTime = 0;
    choice1Sound.play();
  });
  choice1.addEventListener("mouseleave", () => {
    choice1Sound.pause();
  });

  choice2.addEventListener("mouseenter", () => {
    choice2Sound.currentTime = 0;
    choice2Sound.play();
  });
  choice2.addEventListener("mouseleave", () => {
    choice2Sound.pause();
  });

  // Choice 1 click
  choice1.addEventListener("click", async () => {
    choicesDiv.classList.remove("visible");
    await fadeIn(text2, 1500);
    cousin2.play();
  });

  // Choice 2 click
  choice2.addEventListener("click", async () => {
    choicesDiv.classList.remove("visible");
    await fadeIn(text3, 1500);
    cousin3.play();
  });
</script>

</body>
</html>
