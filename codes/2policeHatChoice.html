<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Police Hat Choice</title>

<style>
/* ---------- 1. RESET ------------------------------------------------ */
html,body{
  margin:0;
  width:100vw;
  height:100dvh;
}

/* ---------- 2. OUTER STAGE  ---------------------------------------- */
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fffceb;            /* colour of the letter-box bands     */
  font-family:sans-serif;
  cursor:default;
}

/* ---------- 3. PICTURE  -------------------------------------------- */
/* Size = largest 16 : 9 rectangle that fits in the viewport            */
.picture{
  width :min(100vw,calc(100vh*16/9));
  height:min(100vh,calc(100vw*9/16));

  background:url("../assets/2policeHatChoice/Police-ChooseHat.png")
            center/contain
            no-repeat;

  position:relative;             /* ≙ positioning context for children */
  overflow:hidden;
}

/* ---------- 4. TEXT BOXES & CHOICES -------------------------------- */
#textbox{
  position:absolute;
  bottom:5%;
  left:50%;
  width:25%;
  transform:translateX(-50%);

  opacity:0;                     /* revealed by JS                     */
  transition:opacity 1s ease;
  user-select:none;
  pointer-events:none;
}

.choice{
  position:absolute;
  bottom:5%;
  width:12%;
  transform: translateX(-50%);

  cursor:pointer;
  user-select:none;
  opacity:0;                     /* revealed by JS                     */
  transition: opacity 1s ease, transform 0.2s ease-out;
  display:none;
}

.choice:hover {
  transform: translateX(-50%) scale(1.1);
}

/* symmetrical horizontal placement */
#choice1{left:42%;}
#choice2{left:58%;}
</style>
</head>



<body>

<div class="picture">

  <!-- speech box -->
  <img  id="textbox"
        src=""
        alt="Textbox">

  <!-- clickable choices -->
  <img  id="choice1"
        class="choice"
        src="../assets/2policeHatChoice/choice1.png"
        alt="Choice 1">

  <img  id="choice2"
        class="choice"
        src="../assets/2policeHatChoice/choice2.png"
        alt="Choice 2">

</div>



<script>
/* ---------- AUDIO -------------------------------------------------- */
const himVoice        = new Audio('../assets/2policeHatChoice/HatChoiceQuestion-raha.wav');
const himChoice1Voice = new Audio('../assets/2policeHatChoice/HatChoice1.wav');
const himChoice2Voice = new Audio('../assets/2policeHatChoice/HatChoice2.wav');

/* ---------- ELEMENTS ---------------------------------------------- */
const textbox = document.getElementById('textbox');
const choice1 = document.getElementById('choice1');
const choice2 = document.getElementById('choice2');

/* ---------- HELPERS ------------------------------------------------ */
function showTextbox(src){
  textbox.src = src;
  textbox.style.display = 'block';
  requestAnimationFrame(()=> textbox.style.opacity = '1');
}

function hideTextbox(){
  return new Promise(resolve=>{
    textbox.style.opacity = '0';
    setTimeout(()=>{ textbox.style.display = 'none'; resolve(); },1000);
  });
}

function showChoices(){
  [choice1,choice2].forEach(choice=>{
    choice.style.display = 'block';
    requestAnimationFrame(()=> choice.style.opacity = '1');
  });
}

function hideChoices(){
  return new Promise(resolve=>{
    [choice1,choice2].forEach(c=> c.style.opacity = '0');
    setTimeout(()=>{
      [choice1,choice2].forEach(c=> c.style.display = 'none');
      resolve();
    },1000);
  });
}

/* ---------- SEQUENCE ---------------------------------------------- */
(async () => {
  await new Promise(resolve => setTimeout(resolve, 1000));
  showTextbox('../assets/2policeHatChoice/HimTextbox1.png');
  himVoice.play();
})();

himVoice.onended = async ()=>{
  await hideTextbox();
  showChoices();
};

/* ---------- CHOICE HOVER SOUND ------------------------------------ */
choice1.addEventListener('mouseenter', ()=>{
  himChoice2Voice.pause(); himChoice2Voice.currentTime = 0;
  himChoice1Voice.play();
});
choice1.addEventListener('mouseleave', ()=>{
  himChoice1Voice.pause(); himChoice1Voice.currentTime = 0;
});

choice2.addEventListener('mouseenter', ()=>{
  himChoice1Voice.pause(); himChoice1Voice.currentTime = 0;
  himChoice2Voice.play();
});
choice2.addEventListener('mouseleave', ()=>{
  himChoice2Voice.pause(); himChoice2Voice.currentTime = 0;
});

/* ---------- CLICK NAVIGATION -------------------------------------- */
choice1.addEventListener('click', ()=> window.location.href = '202policeTalk.html');
choice2.addEventListener('click', ()=> window.location.href = '201policeWalkCHill.html');
</script>

</body>
</html>
