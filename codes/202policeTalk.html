<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Police · Talk to Officer</title>

<style>
/* ---------- 1. RESET ------------------------------------------------ */
html,body{
  margin:0;
  width:100vw;
  height:100dvh;
}

/* ---------- 2. OUTER STAGE  ---------------------------------------- */
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0f0f0;          /* colour of the outer letter-box bands */
  font-family:sans-serif;
  cursor:default;
}

/* ---------- 3. PICTURE  -------------------------------------------- */
/* Size = largest 16 : 9 rectangle that fits in the viewport            */
.picture{
  width :min(100vw,calc(100vh*16/9));
  height:min(100vh,calc(100vw*9/16));

  background:url("../assets/202policeTalk/Police-TalkToPolice.png")
            center/contain
            no-repeat;

  position:relative;           /* ≙ positioning context for children   */
  overflow:hidden;
}

/* ---------- 4. TEXTBOX & CHOICES ----------------------------------- */
#policeTextbox{
  position:absolute;
  bottom:3%;
  left:50%;
  transform:translateX(-50%);

  width:25%;
  height:auto;

  opacity:0;
  transition:opacity 1s ease;
  pointer-events:none;
  user-select:none;
}

/* clickable answers */
.choice{
  position:absolute;
  bottom:5%;
  width:12%;
  transform:translateX(-50%);
  cursor:pointer;
  user-select:none;

  opacity:0;
  transition:opacity 1s ease, transform .2s ease;
  display:none;
}

.choice:hover{
  transform:translateX(-50%) scale(1.1);
}

/* symmetrical placement */
#choice1{left:42%;}
#choice2{left:58%;}
</style>
</head>



<body>

<div class="picture">

  <!-- speech balloon -->
  <img id="policeTextbox"
       src="../assets/202policeTalk/PoliceTextBox.png"
       alt="Police textbox">

  <!-- choices -->
  <img id="choice1" class="choice"
       src="../assets/202policeTalk/HimChoice1.png"
       alt="Choice 1">
  <img id="choice2" class="choice"
       src="../assets/202policeTalk/HimChoice2.png"
       alt="Choice 2">

  <!-- audio -->
  <audio id="policeVoice" src="../assets/202policeTalk/policeAskRaha.wav"></audio>
  <audio id="choice1Audio" src="../assets/202policeTalk/rahaChoice1Police.wav"></audio>
  <audio id="choice2Audio" src="../assets/202policeTalk/rahaChoice2Police.wav"></audio>

</div>



<script>
/* ---------- ELEMENTS ------------------------------------------------ */
const policeTextbox = document.getElementById('policeTextbox');
const policeVoice   = document.getElementById('policeVoice');

const choice1       = document.getElementById('choice1');
const choice2       = document.getElementById('choice2');
const choice1Audio  = document.getElementById('choice1Audio');
const choice2Audio  = document.getElementById('choice2Audio');

/* ---------- HELPERS ------------------------------------------------ */
function showTextbox(){
  policeTextbox.style.display = 'block';
  requestAnimationFrame(()=> policeTextbox.style.opacity = '1');
}

function hideTextbox(){
  return new Promise(r=>{
    policeTextbox.style.opacity='0';
    setTimeout(()=>{ policeTextbox.style.display='none'; r(); },1000);
  });
}

function showChoices(){
  [choice1,choice2].forEach(c=>{
    c.style.display='block';
    requestAnimationFrame(()=> c.style.opacity='1');
  });
}

/* ---------- SCENE -------------------------------------------------- */
(async ()=>{
  /* small delay before anything happens ---------------------------- */
  await new Promise(res=>setTimeout(res,1000));

  showTextbox();
  policeVoice.play();
})();

policeVoice.onended = async ()=>{
  await hideTextbox();
  showChoices();
};

/* ---------- HOVER AUDIO ------------------------------------------- */
choice1.addEventListener('mouseenter', ()=>{
  choice2Audio.pause(); choice2Audio.currentTime=0;
  choice1Audio.play();
});
choice1.addEventListener('mouseleave', ()=>{
  choice1Audio.pause(); choice1Audio.currentTime=0;
});

choice2.addEventListener('mouseenter', ()=>{
  choice1Audio.pause(); choice1Audio.currentTime=0;
  choice2Audio.play();
});
choice2.addEventListener('mouseleave', ()=>{
  choice2Audio.pause(); choice2Audio.currentTime=0;
});

/* ---------- CLICK NAVIGATION -------------------------------------- */
choice1.onclick = ()=> location.href = '3policeFight.html';
choice2.onclick = ()=> location.href = '4policeAnt.html';
</script>

</body>
</html>
