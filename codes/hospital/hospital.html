<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page 2</title>
  <style>
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      overflow: hidden;
    }

    .container {
      width: min(100vw, calc(100vh * (1065 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1065)));
      aspect-ratio: 1065 / 1176;
      position: relative;
      overflow: hidden;
    }

    .picture {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .picture img.background {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hotspot {
      position: absolute;
      top: 45%;
      left: 50%;
      width: 35%;
      height: 30%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 2;
      /* outline: 1px solid red; */
    }

    .caption-container {
      position: absolute;
      top: 82%;
      left: 50%;
      transform: translateX(-50%);
      width: 45%;
      z-index: 3;
    }

    .caption-image {
      position: absolute;
      width: 100%;
      height: auto;
      top: 0;
      left: 0;
      transition: opacity 0.3s ease;
    }

    #farsiCaption {
      opacity: 1;
    }

    #englishCaption {
      opacity: 0;
    }

    .caption-container:hover #farsiCaption {
      opacity: 0;
    }

    .caption-container:hover #englishCaption {
      opacity: 1;
    }

    .text-box {
      position: absolute;
      top: 90%;
      left: 50%;
      width: 55%;
      transform: translateX(-50%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
      z-index: 4;
      pointer-events: none;
    }
    .text-box.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .text-box img {
      width: 100%;
      height: auto;
      display: block;
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="picture">
      <img class="background" src="assets/optimized/hospital.png" alt="Hospital Background">
      
      <div class="hotspot"></div>

      <div class="caption-container">
        <img id="farsiCaption" class="caption-image" src="assets/optimized/HospitalFarsiCaption.png" alt="Farsi Caption">
        <img id="englishCaption" class="caption-image" src="assets/optimized/HospitalEnglishCaption.png" alt="English Caption">
      </div>

      <div id="fatherTextBox" class="text-box">
        <img src="assets/optimized/FatherHospitalTextBox.png" alt="Father's message">
      </div>
      <div id="motherTextBox" class="text-box">
        <img src="assets/optimized/MotherHospitalTextBox.png" alt="Mother's message">
      </div>
    </div>
  </div>

  <audio id="fatherVoice" src="assets/optimized/dad-hospital.wav"></audio>
  <audio id="motherVoice" src="assets/optimized/mom-hospital.wav"></audio>

  <script>
    const hotspot = document.querySelector('.hotspot');
    const fatherVoice = document.getElementById('fatherVoice');
    const motherVoice = document.getElementById('motherVoice');
    const fatherTextBox = document.getElementById('fatherTextBox');
    const motherTextBox = document.getElementById('motherTextBox');

    let isPlaying = false;

    function showTextBox(textBox) {
      textBox.classList.add('visible');
    }

    function hideTextBox(textBox) {
      textBox.classList.remove('visible');
    }

    function resetAudio() {
      fatherVoice.pause();
      motherVoice.pause();
      fatherVoice.currentTime = 0;
      motherVoice.currentTime = 0;
      hideTextBox(fatherTextBox);
      hideTextBox(motherTextBox);
      isPlaying = false;
    }

    function playSequence() {
      if (isPlaying) return;

      isPlaying = true;
      showTextBox(fatherTextBox);
      fatherVoice.play();

      fatherVoice.onended = () => {
        hideTextBox(fatherTextBox);
        showTextBox(motherTextBox);
        motherVoice.play();

        motherVoice.onended = () => {
          hideTextBox(motherTextBox);
          isPlaying = false;
        };
      };
    }

    hotspot.addEventListener('mouseenter', playSequence);
    hotspot.addEventListener('mouseleave', resetAudio);
  </script>

</body>
</html>
