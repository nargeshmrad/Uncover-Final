<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Police Arrest Dialogue</title>
<style>
  html, body {
    margin: 0;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fffceb;
  }
  .container {
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fffceb;
  } /* position: relative ensures absolutely positioned children (textbox) are relative to this container */

  .container img.background {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
  }
  /* ------------- generic look ------------- */
  .textbox {
    position: absolute;
    opacity: 0;
    transition: opacity 1s ease;
    user-select: none;
    width: 20%; /* Responsive: 20% of parent width */
    max-width: 1000px;
    min-width: 10px;
    max-height: 20%; /* Responsive: up to 20% of parent height */
    min-height: 10px;
    transform: translateX(-50%);
    z-index: 2;
    box-sizing: border-box;
  }
  .textbox--him {
    left: 50%;
    top: 12%;
  }
  .textbox--police {
    left: 40%;
    top: 60%;
  }

</style>
</head>
<body>

<div class="container">
  <img class="background" src="../assets/1policeArrest/Police-Arrest.png" alt="Background">
  <img id="textbox-him" class="textbox textbox--him" src="../assets/1policeArrest/HimTextbox.png" alt="Textbox Him">
  <img id="textbox-police" class="textbox textbox--police" src="../assets/1policeArrest/Police.png" alt="Textbox Police">
</div>

<script>
  const himVoice = new Audio('../assets/1policeArrest/HimVoice.mp3');
  const policeVoice = new Audio('../assets/1policeArrest/policeVoice.mp3');
  const textbox = document.getElementById('textbox');

  // Utility to show/hide a textbox by id
  function showTextbox(id) {
    const el = document.getElementById(id);
    el.style.opacity = '0';
    el.style.display = 'block';
    requestAnimationFrame(() => el.style.opacity = '1');
  }
  function hideTextbox(id) {
    return new Promise(resolve => {
      const el = document.getElementById(id);
      el.style.opacity = '0';
      setTimeout(() => {
        el.style.display = 'none';
        resolve();
      }, 1000);
    });
  }

  // Sequence
  showTextbox('textbox-him');
  himVoice.play();

  himVoice.onended = async () => {
    await hideTextbox('textbox-him');
    showTextbox('textbox-police');
    policeVoice.play();

    policeVoice.onended = async () => {
      await hideTextbox('textbox-police');
      //window.location.href = '2policeHatChoice.html';
    };
  };

</script>

</body>
</html>
