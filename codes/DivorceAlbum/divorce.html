<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Divorce Album Interaction</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f0f0f0;
    }

    .container {
      position: relative;
      width: auto;
      max-width: 1070px;
      aspect-ratio: 1070 / 1176;
      height: auto;
      max-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      outline: 2px solid rgb(165, 219, 50); /* Debug border */
    }

    .container img.background {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .tear {
      position: absolute;
      height: auto;
      cursor: grab;
      z-index: 1;
      transition: all 2s ease;
    }

    /* Position based on container percentages */
    #tear1 {
      top: 21.4%;
      left: 47%;
      width: 35%; /* Increased from 20% */
      transform: scale(1.2); /* Increased from 1 */
    }

    #tear2 {
      top: 15.8%;
      left: 13.5%;
      width: 35%; /* Increased from 20% */
      transform: scale(1); /* Increased from 0.83 */
    }

    .tear.moved-right {
      transform: translateX(5%) scale(1.2) !important;
    }

    .tear.moved-left {
      transform: translateX(-5%) scale(1) !important;
    }
  </style>
</head>
<body>

  <div class="container" id="interactionArea">
    <img class="background" src="assets/optimized/DivorceAlbum.png" alt="Background">
    <img class="tear" id="tear1" src="assets/optimized/TearedDivorce1.png" alt="Tear 1">
    <img class="tear" id="tear2" src="assets/optimized/TearedDivorce2.png" alt="Tear 2">
  </div>

  <audio id="divorceAudio" src="assets/optimized/DivorceSad.mp3" preload="auto"></audio>

  <script src="divorce.js"></script>

</body>
</html>
