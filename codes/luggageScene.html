<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luggage Scene</title>
  <style>
    html, body {
      margin: 0;
      padding: 0; /* Added padding:0 for consistency */
      width: 100%; /* Ensure body takes full width */
      height: 100%; /* Ensure body takes full height */
      overflow: hidden; /* Prevent scrollbars on body */
      /*background: #000; /* Background for letterbox/pillarbox areas */
    }

    .container {
      position: relative; /* For absolute positioning of sketch-holder */
      width: 100vw;
      height: 100vh;
      display: flex; /* Helps center the image if it's smaller than container */
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Clip anything outside */
      /* outline: 2px solid rgb(165, 219, 50); */ /* Debug border */
    }

    .container img.background {
      max-width: 100%; /* Fit width */
      max-height: 100%; /* Fit height */
      object-fit: contain; /* Crucial for aspect ratio */
      display: block; /* Removes extra space below image */
    }

    #sketch-holder {
      position: absolute; /* To overlay the background image precisely */
      /* top, left, width, height will be set by JavaScript */
      /* outline: 2px solid blue; */ /* Debug: shows sketch-holder bounds */
    }

    canvas {
      display: block; /* p5.js default, good */
      /* outline: 2px solid red; */ /* Debug: shows canvas bounds */
    }

    .responsive-image-button {
      position: absolute; /* !!! CHANGED: Now relative to #sketch-holder !!! */
      bottom: 15px;       /* Example: 15px from the bottom of the image area */
      right: 15px;        /* Example: 15px from the right of the image area */
      z-index: 100;       /* Ensure it's above the canvas (p5.js canvas defaults to z-index auto or 0) */
      display: none;      /* Start hidden, will be shown by JS when game is 'Done' */
                          /* If you want it always visible, change to 'block' or 'inline-block' */
    }

    .responsive-image-button img {
      display: block;
      width: 7vw;         /* Your preferred responsive width based on viewport */
      max-width: 70px;    /* Optional: Cap max size */
      min-width: 20px;    /* Optional: Ensure minimum size */
      height: auto;       /* Maintain aspect ratio */
      transition: transform 0.2s ease-out;
    }

    .responsive-image-button:hover img {
      transform: scale(1.1);
    }

  </style>
</head>
<body>
  <div class="container" id="main-container"> <!-- Added ID for easier JS selection -->
    <img class="background" id="bg-image" src="../assets/luggageScene/LuggageScene.png" alt="Background">
    <div id="sketch-holder">
      <a href="../../game.html" id="back_to_flipbook_button" class="responsive-image-button">
        <img src="../assets/luggageScene/icon_flipbook.png" alt="Back to Flipbook">
      </a>
    </div> <!-- p5.js canvas will be parented here -->
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/addons/p5.sound.min.js"></script> --> <!-- Duplicate -->
  <script src="https://p5play.org/v3/planck.min.js"></script>
  <script src="https://p5play.org/v3/p5play.js"></script>
  <script src="luggageScene.js"></script>
</body>
</html>
