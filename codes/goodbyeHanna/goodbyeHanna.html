<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Graduation Scene</title>
  <style>
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }

    .picture {
      aspect-ratio: 1065 / 1176;
      width: min(100vw, calc(100vh * (1065 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1065)));
      position: relative;
      overflow: hidden;
    }

    .background {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hotspot {
      position: absolute;
      z-index: 1;
    }

    .text-overlay {
      position: absolute;
      top: 90%;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      opacity: 0;
      display: none;
      transition: opacity 0.5s;
      z-index: 3;
      pointer-events: none;
    }
    .text-overlay.visible {
      opacity: 1;
      display: block;
      pointer-events: auto;
    }
    .caption-container {
      position: absolute;
      top: 62%;
      left: 20%;
      transform: translateX(-50%);
      width: 20%;
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: auto;
    }
    .caption-img {
      position: absolute;
      width: 100%;
      height: auto;
      left: 0;
      top: 0;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .caption-img.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .caption-container:hover #capGoodbyeHanaJap.visible {
      opacity: 0;
      pointer-events: none;
    }
    .caption-container:hover #capGoodbyeHanaEng {
      opacity: 1;
      pointer-events: auto;
    }
    .hotspot {
      position: absolute;
      z-index: 2;
      top: 10%;
      left: 7%;
      width: 40%;
      height: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="picture">
      <img class="background" src="assets/optimized/byeHana.png" alt="Goodbye Hanna Background" />
      <div class="hotspot" id="goodbyeHotspot"></div>
      <img class="text-overlay" id="rahaSayBye" src="assets/optimized/RahaSayBye.png" alt="Raha Says Bye" />
      <img class="text-overlay" id="hanaAnswer" src="assets/optimized/HanaAnswer.png" alt="Hana Answers" />
      <div class="caption-container">
        <img class="caption-img visible" id="capGoodbyeHanaJap" src="assets/optimized/capGoodbyeHanaJap.png" alt="Goodbye Caption Japanese" />
        <img class="caption-img" id="capGoodbyeHanaEng" src="assets/optimized/capGoodbyeHanaEng.png" alt="Goodbye Caption English" />
      </div>
    </div>
  </div>
  <script src="goodbyeHanna.js" type="module"></script>
