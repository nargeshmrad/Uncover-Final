<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Police Fight Scene</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ebe4ce;
  }
  .scene-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: none;
  }
  img.bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 5.5s ease;
  }
  img.bg.visible {
    opacity: 1;
  }
.textbox {
  position: absolute;
  left: 65%;
  top: 10%;
  width: 50%;
  max-width: 400px;
  height: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  user-select: none;
  z-index: 10;
  transform: translate(-50%, 0);
}
.textbox.visible {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>
<body>
  <div class="scene-container">
    <img id="bg1" class="bg" src="../assets/3policeFight/Police-Fight1.png" alt="Background 1" />
    <img id="bg2" class="bg" src="../assets/3policeFight/Police-Fight2.png" alt="Background 2" />
    <img id="bg3" class="bg" src="../assets/3policeFight/Police-Fight3.png" alt="Background 3" />
    <img id="bg4" class="bg" src="../assets/3policeFight/Police-Fight4.png" alt="Background 4" />
    <img id="strangerTextBox" class="textbox" src="../assets/3policeFight/strangerFightTextBox.png" alt="Stranger Textbox" style="display:none;" />
    <img id="policeTextBox" class="textbox" src="../assets/3policeFight/policeFightTextBox.png" alt="Police Textbox" style="display:none;" />
  </div>

<script>
  // Audio files - make sure the paths are correct
  const policeVoice = new Audio("../assets/3policeFight/PoliceFightStranger.wav");
  const sadStranger = new Audio("../assets/3policeFight/StrangerFightPolice.wav");
  const sadWalk = new Audio("../assets/3policeFight/SadWalk.mp3");

  // Elements
  const bg1 = document.getElementById("bg1");
  const bg2 = document.getElementById("bg2");
  const bg3 = document.getElementById("bg3");
  const bg4 = document.getElementById("bg4");
  const strangerTextBox = document.getElementById("strangerTextBox");
  const policeTextBox = document.getElementById("policeTextBox");

  // Utility functions for fade in/out
  function fadeIn(el) {
    el.style.display = '';
    setTimeout(() => el.classList.add('visible'), 10);
  }
  function fadeOut(el) {
    el.classList.remove('visible');
    setTimeout(() => { el.style.display = 'none'; }, 800);
  }
  function fadeInMusic(audio, targetVol = 0.5, fadeMs = 2000) {
    audio.volume = 0.0;
    audio.play();
    let step = 0;
    const steps = 20;
    const interval = fadeMs / steps;
    const volStep = targetVol / steps;
    const fade = setInterval(() => {
      step++;
      audio.volume = Math.min(targetVol, audio.volume + volStep);
      if (step >= steps) clearInterval(fade);
    }, interval);
  }

  function playSequence() {
    // Start with bg1 and Stranger's textbox, play StrangerFightPolice.wav
    bg1.classList.add('visible');
    fadeIn(strangerTextBox);
    sadStranger.currentTime = 0;
    sadStranger.play();
    sadStranger.onended = () => {
      fadeOut(strangerTextBox);
      // Next: police textbox and voice
      setTimeout(() => {
        fadeIn(policeTextBox);
        policeVoice.currentTime = 0;
        policeVoice.play();
        policeVoice.onended = () => {
          fadeOut(policeTextBox);
          // Start music and background transitions together
          setTimeout(() => {
            fadeInMusic(sadWalk, 0.5, 2500);
            // Chain background transitions
            bg1.classList.remove('visible');
            bg2.classList.add('visible');
            setTimeout(() => {
              bg2.classList.remove('visible');
              bg4.classList.add('visible');
              setTimeout(() => {
                bg4.classList.remove('visible');
                bg3.classList.add('visible');
                setTimeout(() => {
                  window.location.href = "5policewalk.html";
                }, 6000);
              }, 4000);
            }, 4000);
          }, 800); // wait for textbox fade
        };
      }, 800);
    };
  }

  window.onload = () => {
    // Hide both textboxes initially
    strangerTextBox.style.display = 'none';
    policeTextBox.style.display = 'none';
    playSequence();
  };
</script>
</body>
</html>
