<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Gathering</title>
  <style>
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }

    .picture {
      aspect-ratio: 1065 / 1176;
      width: min(100vw, calc(100vh * (1065 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1065)));
      position: relative;
      overflow: hidden;
    }

    .background {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hotspot {
      position: absolute;
      z-index: 2;

    }

    .hotspot.tar {
      top: 7%;
      left: 20%;
      width: 25%;
      height: 30%;

   
    }

    .hotspot.dance {
      top: 25%;
      left: 47%;
      width: 35%;
      height: 30%;

    }
  </style>
</head>
<body>

  <div class="picture" id="gatheringScene">
    <img class="background" src="assets/optimized/familyGathering.png" alt="Family Gathering Background">
    <div class="hotspot tar" id="tarHotspot"></div>
    <div class="hotspot dance" id="danceHotspot"></div>
  </div>

  <script type="module" src="FamilyGathering.js"></script>

</body>
</html>
