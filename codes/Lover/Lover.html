<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>sushi</title>
  <style>
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
    }

    /* --- 2. PICTURE (Responsive Container) --------------------------- */
    .picture {
      aspect-ratio: 1070 / 1176;
      width: min(100vw, calc(100vh * (1070 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1070)));
      position: relative;
      overflow: hidden;
    }

    .background {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* --- 3. HOTSPOTS (Direct Children of .picture) -------------------- */
    .hotspot {
      position: absolute;
      z-index: 2;

    }
    .love-hotspot {
      top: 15%;
      left: 20%;
      width: 60%;
      height: 60%;
    }
    .love-overlay {
      position: absolute;
      top: 90%;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: auto;
      opacity: 0;
      display: none;
      transition: opacity 0.5s ease;
      z-index: 3;
    }



  </style>

</head>
<body>

  <div class="container">
    <div class="picture">
      <img class="background" src="assets/optimized/love.png" alt="lover Background">
      <div class="hotspot love-hotspot" id="loveHotspot"></div>
      <img id="loveTextImg1" class="love-overlay" src="assets/optimized/loveText.png" alt="Love Text">
      <img id="loveTextImg2" class="love-overlay" src="assets/optimized/loveText2.png" alt="Love Text2">


  <!-- Dialogue logic and overlays handled by PartyDance.js using createDialogueHotspot -->
  <script type="module" src="Lover.js"></script>
</body>
</html>
