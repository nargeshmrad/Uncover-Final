<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>6 · Police Razor</title>

<style>
/* ---------- 1. RESET ------------------------------------------------ */
html,body{
  margin:0;
  width:100vw;
  height:100dvh;
}

/* ---------- 2. OUTER STAGE  ---------------------------------------- */
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fffceb;                /* letter-box colour                */
  font-family:sans-serif;
  cursor:default;
}

/* ---------- 3. PICTURE  -------------------------------------------- */
/* largest 16 : 9 rectangle that fits in the viewport                   */
.picture{
  width :min(100vw,calc(100vh*16/9));
  height:min(100vh,calc(100vw*9/16));

  position:relative;                /* positioning context              */
  overflow:hidden;
}

/* two interchangeable background frames                               */
.background{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  object-fit:contain;
  user-select:none;pointer-events:none;
  transition:opacity 1.5s ease;
  opacity:0;
  z-index:1;
}
#bg1{opacity:1;}                   /* first frame visible on load      */

/* ---------- 4. SPEECH BALLOON -------------------------------------- */
#textBox{
  position:absolute;
  top:25%;
  left:50%;
  transform:translate(-50%,-50%);
  width:35%;
  height:auto;

  opacity:0;
  transition:opacity 1.5s ease;
  pointer-events:none;
  user-select:none;
  z-index:2;
}
#textBox.visible{opacity:1;pointer-events:auto;}

/* ---------- 5. RESPONSIVE BACK BUTTON ------------------------------ */
.responsive-image-button{
  position:absolute;
  top:5%;
  right:3%;
  display:none;                    /* shown later via JS               */
  z-index:3;
}
.responsive-image-button img{
  width:clamp(20px,7vw,70px);
  height:auto;
  display:block;
  transition:transform .2s ease-out;
}
.responsive-image-button:hover img{transform:scale(1.1);}
</style>
</head>



<body>

<div class="picture">

  <!-- backgrounds -->
  <img id="bg1" class="background"
       src="../assets/6policeRasor/Police-Rasor.png"  alt="Frame 1">
  <img id="bg2" class="background"
       src="../assets/6policeRasor/Police-Rasor2.png" alt="Frame 2">

  <!-- speech balloon -->
  <img id="textBox"
       src="../assets/6policeRasor/HimTextBox.png"
       alt="Him speech">

  <!-- back button -->
  <a id="flipbook_back_button" class="responsive-image-button"
     href="../../game.html">
     <img src="../assets/6policeRasor/albumIcon.png" alt="Back to game">
  </a>

  <!-- audio -->
  <audio id="himVoice"  src="../assets/6policeRasor/RahaRasor.wav"></audio>
  <audio id="rasorSfx"  src="../assets/6policeRasor/Rasor.mp3"></audio>

</div>



<script>
/* ---------- ELEMENTS ------------------------------------------------ */
const bg1       = document.getElementById('bg1');
const bg2       = document.getElementById('bg2');
const textBox   = document.getElementById('textBox');
const himVoice  = document.getElementById('himVoice');
const rasorSfx  = document.getElementById('rasorSfx');
const backBtn   = document.getElementById('flipbook_back_button');

/* ---------- HELPERS ------------------------------------------------ */
function show(el){ el.classList.add('visible'); }
function hide(el){ el.classList.remove('visible'); }

/* ---------- SCENE -------------------------------------------------- */
async function playScene(){
  /* 1-second delay before anything happens ------------------------- */
  await new Promise(r=>setTimeout(r,1000));

  /* 1️⃣  show textbox + play voice -------------------------------- */
  show(textBox);
  himVoice.play();

  himVoice.onended = async ()=>{
    /* hide textbox -------------------------------------------------- */
    hide(textBox);

    /* 2️⃣  razor phase -------------------------------------------- */
    rasorSfx.play().catch(()=>{});

    /* cross-fade backgrounds                                        */
    bg2.style.opacity = '1';
    bg1.style.opacity = '0';

    /* show back button after 8 s ---------------------------------- */
    setTimeout(()=> backBtn.style.display='block', 6000);
  };
}

/* ---------- AUTO START -------------------------------------------- */
window.onload = playScene;
</script>

</body>
</html>
