<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4 · Police Ant View</title>

<style>
/* ---------- 1. RESET ------------------------------------------------ */
html,body{
  margin:0;
  width:100vw;
  height:100dvh;
}

/* ---------- 2. OUTER STAGE  ---------------------------------------- */
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fffceb;                  /* letter-box colour                 */
  font-family:sans-serif;
  cursor:default;
}

/* ---------- 3. PICTURE  -------------------------------------------- */
/* biggest 16 : 9 rectangle that fits inside the viewport              */
.picture{
  width :min(100vw,calc(100vh*16/9));
  height:min(100vh,calc(100vw*9/16));

  position:relative;               /* positioning context for children  */
  overflow:hidden;
}

/* two background frames                                                */
.background{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  object-fit:contain;
  user-select:none;pointer-events:none;
  transition:opacity 1.5s ease;
  opacity:0;
  z-index:1;
}
#bg1{opacity:1;}                  /* first frame visible on load       */

/* ---------- 4. SPEECH BALLOONS ------------------------------------- */
.textbox{
  position:absolute;
  width:30%;
  left:50%;
  height:auto;
  opacity:0;
  transform:translateX(-50%);
  transition:opacity 1.5s ease;
  pointer-events:none;
  user-select:none;
  z-index:2;
}
/* positions in % of the picture */
#himTextBox   {bottom:5%;}
#policeTextBox{top:10%;}
.textbox.visible{opacity:1;pointer-events:auto;}

/* ---------- 5. CHOICE BUTTONS -------------------------------------- */
#choices{
  position:absolute;
  bottom:5%;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  justify-content: center;
  gap:5vw;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
  z-index:3;
}
#choices.visible{opacity:1;pointer-events:auto;}

#choices img{
  width:25%;
  height:auto;
  cursor:pointer;
  user-select:none;
  transition:filter .3s, transform .2s;
}
#choices img:hover{
  transform: scale(1.1);
}
</style>
</head>



<body>

<div class="picture">

  <!-- backgrounds -->
  <img id="bg1" class="background"
       src="../assets/4policeAnt/Police-AntView.png"  alt="Ant view frame 1">
  <img id="bg2" class="background"
       src="../assets/4policeAnt/Police-AntView2.png" alt="Ant view frame 2">

  <!-- speech balloons -->
  <img id="himTextBox"    class="textbox"
       src="../assets/4policeAnt/HimAppologyTextBox.png"
       alt="Him apology">

  <img id="policeTextBox" class="textbox"
       src="../assets/4policeAnt/policeTextBox.png"
       alt="Police reply">

  <!-- choices -->
  <div id="choices">
    <img id="choice1" src="../assets/4policeAnt/himTextBox1.png" alt="Choice 1">
    <img id="choice2" src="../assets/4policeAnt/himTextBox2.png" alt="Choice 2">
  </div>

  <!-- audio -->
  <audio id="himVoice"     src="../assets/4policeAnt/RahaSorryPolice.wav"></audio>
  <audio id="policeVoice"  src="../assets/4policeAnt/PoliceHumiliateRaha.wav"></audio>
  <audio id="choice1Audio" src="../assets/4policeAnt/RahaAcceptChoice.wav"></audio>
  <audio id="choice2Audio" src="../assets/4policeAnt/RahaAskHelpChoice.wav"></audio>

</div>



<script>
/* ---------- ELEMENTS ------------------------------------------------ */
const bg1          = document.getElementById('bg1');
const bg2          = document.getElementById('bg2');

const himBox       = document.getElementById('himTextBox');
const policeBox    = document.getElementById('policeTextBox');

const choicesWrap  = document.getElementById('choices');
const choice1      = document.getElementById('choice1');
const choice2      = document.getElementById('choice2');

const himVoice     = document.getElementById('himVoice');
const policeVoice  = document.getElementById('policeVoice');
const choice1Audio = document.getElementById('choice1Audio');
const choice2Audio = document.getElementById('choice2Audio');

/* ---------- SMALL HELPERS ----------------------------------------- */
function show(el){ el.classList.add('visible'); }
function hide(el){ el.classList.remove('visible'); }

/* ---------- MAIN SEQUENCE ----------------------------------------- */
async function playScene(){
  /* small delay before anything appears ---------------------------- */
  await new Promise(r=>setTimeout(r,1000));

  /* 1️⃣  Him apologises -------------------------------------------- */
  show(himBox);
  himVoice.play();

  himVoice.onended = ()=>{
    hide(himBox);

    setTimeout(()=>{
      /* 2️⃣  Police replies ---------------------------------------- */
      show(policeBox);
      policeVoice.play();

      policeVoice.onended = ()=>{
        hide(policeBox);

        setTimeout(()=>{
          /* 3️⃣  switch background + show choices ------------------ */
          hide(bg1); show(bg2);
          show(choicesWrap);
        },1500);                                            // wait for fade
      };
    },1500);                                                // after himBox fade
  };
}

/* ---------- HOVER AUDIO ------------------------------------------- */
choice1.onmouseenter = ()=>{ choice2Audio.pause(); choice1Audio.currentTime=0; choice1Audio.play(); };
choice1.onmouseleave = ()=>{ choice1Audio.pause(); };
choice2.onmouseenter = ()=>{ choice1Audio.pause(); choice2Audio.currentTime=0; choice2Audio.play(); };
choice2.onmouseleave = ()=>{ choice2Audio.pause(); };

/* ---------- CLICK NAVIGATION -------------------------------------- */
choice1.onclick = ()=> location.href = '6policeRasor.html';
choice2.onclick = ()=> location.href = '3policeFight.html';

/* ---------- AUTO START -------------------------------------------- */
window.onload = playScene;
</script>

</body>
</html>
