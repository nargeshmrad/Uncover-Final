<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Painting Scene</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f0f0f0;
    }

    .container {
      position: relative;
      width: auto;
      max-width: 1070px;
      aspect-ratio: 1070 / 1176;
      height: auto;
      max-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      outline: 2px solid rgb(165, 219, 50); /* Debug border */
    }

    .container img.background {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .cloud {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 25%;
      cursor: move;
      transition: transform 0.5s ease;
      animation: floatMotion 3s infinite alternate;
    }

    @keyframes floatMotion {
      0% { transform: translate(0, 0); }
      50% { transform: translate(10px, 10px); }
      100% { transform: translate(0, 0); }
    }

    .shadow {
      position: absolute;
      top: 51%;
      left: 55%;
      transform: translate(-50%, -50%);
      width: 20%;
      opacity: 0;
      transition: opacity 6s ease;
      pointer-events: none;
    }

    
    .caption {
      position: absolute;
      left: 50%;
      top: 85%;
      width: 20%;
      transform: translate(-50%, 0);
      z-index: 10;
      pointer-events: auto;
      transition: filter 0.2s;
      cursor: pointer;
    }
    .caption:hover {
      content: url('assets/optimized/paintingCapEng.png');
    }
    .textBox {
      position: absolute;
      top: 90%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55%;
      opacity: 0;
      transition: opacity 7s ease;
      pointer-events: none;
      z-index: 20;
    }

  </style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const cloud = document.querySelector('.cloud');
  const container = document.querySelector('.container');
  let isDraggingCloud = false;
  let cloudOffsetX = 0;
  let cloudOffsetY = 0;

  if (cloud) {
    cloud.style.cursor = 'grab';

    cloud.addEventListener('mousedown', function(e) {
      isDraggingCloud = true;
      cloudOffsetX = e.offsetX;
      cloudOffsetY = e.offsetY;
      cloud.style.cursor = 'grabbing';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDraggingCloud) return;
      const rect = container.getBoundingClientRect();
      let newX = e.clientX - rect.left - cloudOffsetX;
      let newY = e.clientY - rect.top - cloudOffsetY;
      // Clamp within container
      const cloudW = cloud.offsetWidth;
      const cloudH = cloud.offsetHeight;
      newX = Math.max(0, Math.min(rect.width - cloudW, newX));
      newY = Math.max(0, Math.min(rect.height - cloudH, newY));
      cloud.style.left = `${newX}px`;
      cloud.style.top = `${newY}px`;
      cloud.style.position = 'absolute';
    });

    window.addEventListener('mouseup', function() {
      if (isDraggingCloud) {
        isDraggingCloud = false;
        cloud.style.cursor = 'grab';
      }
    });
  }
});
</script>
</head>
<body>

  <div class="container">
    <img class="background" src="assets/optimized/painting.png" alt="Painting Background" />
    <img class="caption" src="assets/optimized/paintingCapEJap.png" alt="Painting Caption" />
    <img class="cloud" src="assets/optimized/cloud.png" alt="Cloud" />
    <img class="shadow" src="assets/optimized/shadow.png" alt="Shadow" />
    <img class="textBox" src="assets/optimized/textBoxPainting.png" alt="Text Box" />
  </div>

  <audio id="paintingAudio" src="assets/optimized/painting.mp3"></audio>

  <script>
    const cloud = document.querySelector('.cloud');
    const shadow = document.querySelector('.shadow');
    const textBox = document.querySelector('.textBox');
    const audio = document.getElementById('paintingAudio');

    let isDragging = false;
    let offsetX, offsetY;

    const container = document.querySelector('.container');

    // Responsive square area in percentage relative to container size
    const squareAreaRatio = { top: 18.2, left: 28, width: 37.4, height: 34 }; // Example ratios

    cloud.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.offsetX;
      offsetY = e.offsetY;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const rect = container.getBoundingClientRect();
        let newLeft = e.clientX - rect.left - offsetX;
        let newTop = e.clientY - rect.top - offsetY;

        cloud.style.left = `${(newLeft / rect.width) * 100}%`;
        cloud.style.top = `${(newTop / rect.height) * 100}%`;

        const squareLeftPx = (squareAreaRatio.left / 100) * rect.width;
        const squareTopPx = (squareAreaRatio.top / 100) * rect.height;
        const squareWidthPx = (squareAreaRatio.width / 100) * rect.width;
        const squareHeightPx = (squareAreaRatio.height / 100) * rect.height;

        if (newLeft < squareLeftPx || newLeft > squareLeftPx + squareWidthPx ||
            newTop < squareTopPx || newTop > squareTopPx + squareHeightPx) {
          
          shadow.style.opacity = 1;
          textBox.style.opacity = 1;
          setTimeout(() => {
            if (audio.paused) {
              audio.currentTime = 0;
              audio.play();
            }
          }, 1000);

        } else {
          shadow.style.opacity = 0;
          textBox.style.opacity = 0;
          audio.pause();
          audio.currentTime = 0;
        }
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    audio.addEventListener('ended', () => {
      textBox.style.opacity = 0;
    });
  </script>

</body>
</html>
