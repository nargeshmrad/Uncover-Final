<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5play</title>
    <style>
    html, body {
      margin: 0;
      padding: 0; /* Added padding:0 for consistency */
      width: 100%; /* Ensure body takes full width */
      height: 100%; /* Ensure body takes full height */
      overflow: hidden; /* Prevent scrollbars on body */
      /*background: #000; /* Background for letterbox/pillarbox areas */
    }
    .container {
      position: relative; /* For absolute positioning of sketch-holder */
      width: 100vw;
      height: 100vh;
      display: flex; /* Helps center the image if it's smaller than container */
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Clip anything outside */
      /* outline: 2px solid rgb(165, 219, 50); */ /* Debug border */
    }
    .container img.background {
      max-width: 100%; /* Fit width */
      max-height: 100%; /* Fit height */
      object-fit: contain; /* Crucial for aspect ratio */
      display: block; /* Removes extra space below image */
    }
    #sketch-holder {
      position: absolute; /* To overlay the background image precisely */
      /* top, left, width, height will be set by JavaScript */
      /* outline: 2px solid blue; */ /* Debug: shows sketch-holder bounds */
    }
    canvas {
      display: block; /* p5.js default, good */
      /* outline: 2px solid red; */ /* Debug: shows canvas bounds */
    }

    #dialogueText {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Comic Sans MS', cursive;
      font-size: 24px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px 25px;
      border-radius: 10px;
      display: none;
      text-align: center;
      z-index: 1000;
    }
    .nav-square {
      position: fixed;
      width: 5%;
      height: 5%;
      background-color: rgba(247, 255, 249, 0.5);
      border: 2px solid rgba(40, 167, 69, 0.8);
      cursor: pointer;
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 2000;
    }
    .nav-square:hover {
      background-color: rgba(40, 167, 69, 0.8);
      transform: scale(1.1);
    }
    .cousin-square {
      top: 70%;
      left: 60%;
    }

    .responsive-image-button {
      position: absolute; /* Now relative to #sketch-holder */
      bottom: 5%;
      right: 3%;
      z-index: 100;       /* Ensure it's above the canvas */
      display: none;      /* Start hidden, will be shown by JS when game is 'Done' */
                          /* If you want it always visible, change to 'block' or 'inline-block' */
    }

    .responsive-image-button img {
      display: block;
      width: 7vw;         /* Responsive width based on viewport */
      max-width: 70px;    /* Cap max size */
      min-width: 20px;    /* Ensure minimum size */
      height: auto;       /* Maintain aspect ratio */
      transition: transform 0.2s ease-out;
    }

    .responsive-image-button:hover img {
      transform: scale(1.1);
    }
    </style>
  </head>

  <body>
    <div id="dialogueText"></div>
    <img id="cropTopSpeechImg" src="assets/optimized/textBoxCropTop.png" alt="Crop Top Speech Balloon" style="display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:60vw;width:30vw;z-index:1000;pointer-events:none;" />
    <img id="overallSpeechImg" src="assets/optimized/textBoxOverall.png" alt="Overall Speech Balloon" style="display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:60vw;width:30vw;z-index:1000;pointer-events:none;" />
    <img id="pantSpeechImg" src="assets/optimized/textBoxPant.png" alt="Pant Speech Balloon" style="display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:60vw;width:30vw;z-index:1000;pointer-events:none;" />
    <img id="shirtSpeechImg" src="assets/optimized/textBoxShirt.png" alt="Shirt Speech Balloon" style="display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:60vw;width:30vw;z-index:1000;pointer-events:none;" />
    <img id="shortPantSpeechImg" src="assets/optimized/textBoxShortPant.png" alt="Short Pant Speech Balloon" style="display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:60vw;width:30vw;z-index:1000;pointer-events:none;" />
    <img id="sneakersSpeechImg" src="assets/optimized/textBoxSneakers.png" alt="Sneakers Speech Balloon" style="display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:60vw;width:30vw;z-index:1000;pointer-events:none;" />
    <div class="container" id="main-container">
      <img class="background" id="bg-image" src="assets/optimized/Closet.png" alt="Background">
      <div id="sketch-holder">
        <a href="../fs_1policeArrest/1policeArrest.html" id="next_scene_button" class="responsive-image-button">
          <img src="assets/optimized/nextIcon.png" alt="Next Scene">
        </a>
      </div>
    </div>
    <!-- Navigation to cousinYoung.html
    <a href="cousinYoung.html" class="nav-square cousin-square"></a>
    -->

    <!-- <script src="https://q5js.org/q5.js"></script> -->
    <script src="https://p5play.org/v3/planck.min.js"></script>
    <script src="https://p5play.org/v3/p5play.js"></script>
    <script src="ClosetGatheringTest.js"></script>

</html>
