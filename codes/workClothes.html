<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work Clothes Interaction</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f0f0f0;
    }

    .container {
      position: relative;
      width: auto;
      max-width: 1070px;
      aspect-ratio: 1070 / 1176;
      height: auto;
      max-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      outline: 2px solid rgb(165, 219, 50); /* Debug border */
    }

    .container img.background {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .work-clothes {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: auto;
      z-index: 1;
    }

    .draggable {
      position: absolute;
      cursor: grab;
      z-index: 2;
      transition: all 0.5s ease;
      width: 23.4%;
      height: auto;
    }

    .draggable.faded {
      opacity: 0;
      pointer-events: none;
    }

    #kimono {
      top: 15%; /* 65% from bottom is 35% from top */
      left: 55%; /* Right 10% is left 80% */
      width: 30%; /* Bigger than default draggable width */
    }

    #coat {
      top: 15%;
      left: 19%;
      width: 20%;
    }

    .dropzone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50%;  /* Increased from 40.7% */
      height: 30%;  /* Increased from 40% */
      z-index: 3;
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="background" src="../assets/workClothes/backgrundAlbum.png" alt="Background">
    <img class="work-clothes" id="workClothes" src="../assets/workClothes/WorkClothes1.png" alt="Work Clothes">
    <div class="dropzone" id="dropzone"></div>
    <img class="draggable" id="kimono" src="../assets/workClothes/kimonoOnFloor.png" alt="Kimono">
    <img class="draggable" id="coat" src="../assets/workClothes/coatOnFloor.png" alt="Coat">
  </div>

  <script>
    // Only setup/init here, logic is in workClothes.js
    // DOMContentLoaded ensures elements exist before JS runs
    document.addEventListener('DOMContentLoaded', function() {
      window.initWorkClothesDrag && window.initWorkClothesDrag();
    });
  </script>
  <script src="workClothes.js"></script>

</body>
</html>
