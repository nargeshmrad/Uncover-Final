<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>201policeWalkCHill Scene</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .background {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
      position: absolute;
      top: 0; left: 0;
      transition: opacity 6s ease;
    }
    .fade-bg {
      z-index: 1;
    }

    .textbox {
      position: absolute;
      bottom: 65%;   /* adjust as needed */
      left: 60%;     /* adjust as needed */
      width: 15%;    /* responsive width */
      height: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      user-select: none;
    }

    .textbox.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="scene-container">
    <img src="../assets/201policeWalkCHill/Police-WallChill.png" alt="Background" class="background" id="bg1" />
    <img src="../assets/201policeWalkCHill/Police-WallChill2.png" alt="Background 2" class="background fade-bg" id="bg2" style="opacity:0; pointer-events:none;" />
    <img src="../assets/201policeWalkCHill/HimTextBox.png" alt="Textbox" class="textbox" id="himTextbox" />
    <audio id="himAudio" src="../assets/201policeWalkCHill/raha-walk-police.wav"></audio>
    <audio id="sadWalkAudio" src="../assets/201policeWalkCHill/SadWalk.mp3"></audio>
  </div>

  <script>
    const himTextbox = document.getElementById('himTextbox');
    const himAudio = document.getElementById('himAudio');

    function playScene() {
      himTextbox.classList.add('visible');
      himAudio.play();

      // Fade in SadWalk.mp3 at low volume under the dialogue
      const sadWalkAudio = document.getElementById('sadWalkAudio');
      sadWalkAudio.volume = 0.0;
      sadWalkAudio.play();
      // Fade in to low volume (0.15) over 1.5s
      let fadeInStep = 0;
      const fadeInInterval = setInterval(() => {
        fadeInStep++;
        sadWalkAudio.volume = Math.min(0.15, fadeInStep / 10 * 0.15);
        if (sadWalkAudio.volume >= 0.15) clearInterval(fadeInInterval);
      }, 150);

      himAudio.onended = () => {
        himTextbox.classList.remove('visible');
        // Raise SadWalk.mp3 volume to 0.5 over 1.5s
        let currentVol = sadWalkAudio.volume;
        let targetVol = 0.5;
        let steps = 15;
        let step = 0;
        const upInterval = setInterval(() => {
          step++;
          sadWalkAudio.volume = currentVol + (targetVol - currentVol) * (step / steps);
          if (step >= steps) {
            sadWalkAudio.volume = targetVol;
            clearInterval(upInterval);
          }
        }, 100);
        // Fade in new background after textbox fades out
        setTimeout(() => {
          document.getElementById('bg2').style.opacity = '1';
          document.getElementById('bg1').style.opacity = '0';
        }, 500); // wait for textbox fade-out
      };

    }

    // Automatically start when page loads (optional)
    window.onload = () => {
      playScene();
    };
  </script>
</body>
</html>
