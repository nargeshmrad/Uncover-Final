<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Graduation Scene</title>
  <style>
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }

    .picture {
      aspect-ratio: 1065 / 1176;
      width: min(100vw, calc(100vh * (1065 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1065)));
      position: relative;
      overflow: hidden;
    }

    .background {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hotspot {
      position: absolute;
      z-index: 1;
    }

    .text-box {
      position: absolute;
      top: 85%;
      left: 50%;
      width: 55%;
      transform: translateX(-50%);
      opacity: 0;
      display: none;
      transition: opacity 0.5s;
      z-index: 4;
      pointer-events: none;
    }
    .text-box.visible {
      opacity: 1;
      display: block;
      pointer-events: auto;
    }
    .text-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .hotspot--mom {
  top: 5%;
  left: 20%;
  width: 55%;
  height: 35%;
}

    .caption-image {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="picture">
    <img class="background" src="assets/optimized/Graduation.png" alt="Graduation Background" />

    <div class="hotspot hotspot--mom" id="momHotspot"></div>
    <div class="text-box" id="momCaption">
      <img src="assets/optimized/graduationMomTextBox.png" alt="Mom Caption" />
    </div>

    <!-- Debug: JS module loaded below -->
    <script src="graduation.js" type="module"></script>
