<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Responsive Music Album Interaction</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      cursor: url('../assets/musicAlbum/earCursor.png') 16 16, auto;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      width: auto;
      max-width: 1070px;
      aspect-ratio: 1070 / 1176;
      height: auto;
      max-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      outline: 2px solid rgb(165, 219, 50); /* Debug border */
      background: url('../assets/musicAlbum/background.png') no-repeat center/cover;
    }

    .container img.background {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #cd {
      position: absolute;
      top: 30%; /* visually center in lower half, adjust as needed */
      left: 30%;
      transform: translate(-50%, -50%);
      width: 30%;
      height: auto;
      object-fit: contain;
      transition: transform 0.1s linear;
      will-change: transform;
      cursor: inherit;
    }
    #cd2 {
      position: absolute;
      top: 30%;
      left:70%;
      transform: translate(-50%, -50%);
      width: 30%;
      height: auto;
      object-fit: contain;
      transition: transform 0.1s linear;
      will-change: transform;
      cursor: inherit;
    }
    #cd3 {
      position: absolute;
      top: 70%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 30%;
      height: auto;
      object-fit: contain;
      transition: transform 0.1s linear;
      will-change: transform;
      cursor: inherit;
    }
    #cd4 {
      position: absolute;
      top: 70%;
      left: 70%;
      transform: translate(-50%, -50%);
      width: 30%;
      height: auto;
      object-fit: contain;
      transition: transform 0.1s linear;
      will-change: transform;
      cursor: inherit;
    }
  </style>
</head>
<body>

  <div class="container" aria-label="Music album container">
    <img id="cd" src="../assets/musicAlbum/cd1.png" alt="Music CD" aria-label="Music CD" />
    <img id="cd2" src="../assets/musicAlbum/cd2.png" alt="Music CD 2" aria-label="Music CD 2" />
    <img id="cd3" src="../assets/musicAlbum/cd3.png" alt="Music CD 3" aria-label="Music CD 3" />
    <img id="cd4" src="../assets/musicAlbum/cd4.png" alt="Music CD 4" aria-label="Music CD 4" />
  </div>

  <audio id="setar" src="../assets/musicAlbum/setar.mp3" loop></audio>
  <audio id="santour" src="../assets/musicAlbum/santour.mp3" loop></audio>
  <audio id="kamanche" src="../assets/musicAlbum/Kamanche.mp3" loop></audio>
  <audio id="setar2" src="../assets/musicAlbum/setar2.mp3" loop></audio>

  <script src="musicAlbum.js"></script>
</body>
</html>
