<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nail‑Polish Game</title>

    <!-- ----------- basic styling ---------------------------------- -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* .picture scales with the viewport but always stays 16:9  */
      .picture {
        position: relative;
        width: 92vw;
        max-width: 1280px;
        aspect-ratio: 16/9;
      }

      /* the p5.js sketch fills the wrapper; no extra JS needed  */
      canvas {
        width: 100%;
        height: 100%;
        display: block; /* remove inline‑block gap */
      }

      /* custom cursor styles */
      .cursor-img {
        position: absolute;
        pointer-events: none; /* ignore mouse events */
        z-index: 1; /* bring to front */
      }
    </style>
  </head>
  <body>
    <div class="picture">
      <!-- p5.js will replace this element with its own canvas  -->
      <img id="cursor-img" class="cursor-img" src="assets/optimized/nailBrush.webp" alt="">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
      <script src="nailPolishTesto3.js"></script>
    </div>
  </body>
</html>
