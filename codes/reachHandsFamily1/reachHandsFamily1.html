<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reach Dad Interaction</title>
  <style>
    html, body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }
    body {
      font-family: Arial, sans-serif;
    }
    .picture {
      aspect-ratio: 1065 / 1176;
      width: min(100vw, calc(100vh * (1065 / 1176)));
      height: min(100vh, calc(100vw * (1176 / 1065)));
      position: relative;
      overflow: hidden;
    }
    .background {
      width: 100%;
      height: 100%;
      display: block;
    }
    .floating-image {
      position: absolute;
      width: 15%;
      height: auto;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1s ease;
      user-select: none;
      will-change: transform;
    }
    .text-overlay {
  position: absolute;
  top: 90%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;
  height: auto;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 3;
  pointer-events: none;
}
  </style>
</head>
<body>
  <div class="picture" id="picture">
    <img class="background" src="assets/optimized/reachLeft.png" alt="Background">
    <div class="hotspot" id="reachHotspot" style="position:absolute;top:5%;left:15%;width:200%;height:700%;z-index:2;"></div>
    <img src="assets/optimized/reachLeftText.png" alt="Text Overlay" id="reachLeftText" class="text-overlay" style="display:none;">
    <img src="assets/optimized/money1.png" alt="Money 1" id="money1" class="floating-image" />
    <img src="assets/optimized/money2.png" alt="Money 2" id="money2" class="floating-image" />
    <img src="assets/optimized/flightTicket1.png" alt="Flight Ticket" id="flightTicket" class="floating-image" />
    <img src="assets/optimized/cake.png" alt="Cake" id="cake" class="floating-image" />
    <audio id="reachAudio" src="assets/optimized/divorce-raha1.wav" preload="auto"></audio>
  </div>

  <script src="reachHandsFamily1.js"></script>
</body>
</html>
